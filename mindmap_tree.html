let showAns = false;

function build() {
  const cont = document.getElementById('content');
  cont.innerHTML = '';
  DATA.forEach(cat => {
    const det = document.createElement('details');
    det.className = 'cat-section';
    const sum = document.createElement('summary');
    sum.className = 'cat-summary';
    sum.innerHTML = `<span class="cat-badge">${cat.id}</span><span class="cat-title">${cat.title.slice(2)}</span><span class="cat-arrow">▶</span>`;
    det.appendChild(sum);
    const body = document.createElement('div');
    body.className = 'cat-body';
    cat.items.forEach(item => {
      if(item.g){
        const gl = document.createElement('div');
        gl.className = 'group-label';
        gl.textContent = item.g;
        body.appendChild(gl);
        item.sub.forEach(si => body.appendChild(makeRow(si)));
      } else {
        body.appendChild(makeRow(item));
      }
    });
    det.appendChild(body);
    cont.appendChild(det);
  });
}

function makeRow(item) {
  const row = document.createElement('div');
  row.className = 'item-row';
  const ans = document.createElement('span');
  ans.className = 'item-ans' + (showAns ? '' : ' hidden');
  ans.innerHTML = item.v.replace(/\n/g,'<br>');
  row.innerHTML = `<span class="item-topic">${item.t}</span>`;
  row.appendChild(ans);
  row.onclick = () => ans.classList.toggle('hidden');
  return row;
}

function expandAll() {
  document.querySelectorAll('details').forEach(d => d.open = true);
}
function collapseAll() {
  document.querySelectorAll('details').forEach(d => d.open = false);
}
function toggleAllAns() {
  showAns = !showAns;
  document.getElementById('ans-btn').textContent = showAns ? '🙈 解答を全非表示' : '👁 解答を全表示';
  document.querySelectorAll('.item-ans').forEach(el => {
    showAns ? el.classList.remove('hidden') : el.classList.add('hidden');
  });
}

build();
</script>
