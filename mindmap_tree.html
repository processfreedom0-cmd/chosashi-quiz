<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#b53326">
<title>土地家屋調査士 マインドマップ</title>
<style>
:root{
  --bg:#f1f3f8;--surface:#ffffff;--surface-2:#f6f8fb;--text:#1b2330;--muted:#667085;--line:#e2e7ef;
  --accent:#c0392b;--accent-ink:#ffffff;--accent-soft:#fbe9e7;
  --blue:#1f6fb2;--blue-soft:#e7f1fa;--green:#1b9a55;--green-soft:#e4f5ec;
  --amber:#e39b0b;--amber-soft:#fff2cf;--orange:#e0731f;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --hero:linear-gradient(135deg,#a8281c 0%,#d4503f 100%);
  --glass:rgba(241,243,248,.88);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1117;--surface:#161b24;--surface-2:#1c2330;--text:#e6eaf1;--muted:#97a1b1;--line:#262f3d;
    --accent:#ff7566;--accent-ink:#1a0906;--accent-soft:#3b1f1c;
    --blue:#82c0f4;--blue-soft:#142a40;--green:#52cb8b;--green-soft:#12301f;
    --amber:#f6b93b;--amber-soft:#3a2f10;--orange:#f2994e;
    --shadow:none;
    --hero:linear-gradient(135deg,#5e1b14 0%,#8f3427 100%);
    --glass:rgba(13,17,23,.88);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",Meiryo,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
svg.i{display:block}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- ヒーロー ---- */
.hero{background:var(--hero);color:#fff;padding:calc(16px + env(safe-area-inset-top)) max(16px,calc((100% - 760px)/2 + 12px)) 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{font-size:1.12rem;font-weight:800;letter-spacing:.02em;line-height:1.35}
.hero h1 span{display:inline-block}
.hero p{font-size:.74rem;opacity:.9;margin-top:4px}
.countdown{flex:none;text-align:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:6px 14px;line-height:1.15}
.cd-label{display:block;font-size:.62rem;opacity:.92;letter-spacing:.06em}
.cd-main{font-weight:800;font-size:1.55rem}
.cd-main small{font-size:.72rem;font-weight:700;margin-left:2px}

/* ---- 検索・絞り込み ---- */
.searchbar{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 12px 8px}
.searchbar-in{max-width:760px;margin:0 auto}
.search-field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:44px;color:var(--muted)}
.search-field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,178,.22)}
.search-field input{flex:1;min-width:0;border:none;outline:none;background:none;color:var(--text);font:inherit;font-size:16px;height:100%}
.search-field input::-webkit-search-cancel-button{display:none}
.search-field input::placeholder{color:var(--muted)}
.chips{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:.8rem;font-weight:700;cursor:pointer}
.chip .n{font-size:.72rem;opacity:.75}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hit{margin-left:auto;font-size:.76rem;color:var(--muted)}
.edit-banner{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--amber-soft);border:1px solid var(--amber);font-size:.76rem;line-height:1.5}

/* ---- セクション ---- */
.content{max-width:760px;margin:0 auto;padding:12px 12px 0}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.cat>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;min-height:58px;cursor:pointer;user-select:none;-webkit-user-select:none}
.cat>summary::-webkit-details-marker{display:none}
.badge{flex:none;min-width:36px;height:36px;padding:0 7px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.86rem;display:grid;place-items:center}
.cat-text{flex:1;min-width:0}
.cat-title{font-weight:700;font-size:.95rem;line-height:1.4}
.cat-meta{font-size:.72rem;color:var(--muted);margin-top:2px}
.cat-meta .fl{color:var(--amber);font-weight:700}
.chev{flex:none;color:var(--muted);transition:transform .2s}
.cat[open]>summary .chev{transform:rotate(90deg)}
.cat-body{border-top:1px solid var(--line)}
.group{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface-2);color:var(--blue);font-size:.76rem;font-weight:800;border-bottom:1px solid var(--line)}
.group::before{content:"";width:3px;height:12px;border-radius:2px;background:currentColor;flex:none}
.group.custom{color:var(--green)}

/* ---- 項目 ---- */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"q acts" "ans ans";gap:6px 6px;padding:12px 6px 12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.item:last-child{border-bottom:none}
.item:active{background:var(--surface-2)}
.item.inline{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"q ans acts";align-items:center}
.q{grid-area:q;font-size:.9rem;line-height:1.65;overflow-wrap:anywhere;padding-top:6px}
.item.inline .q{padding-top:0}
.item.is-edited .q{border-left:3px solid var(--orange);padding-left:8px}
.item.is-custom{box-shadow:inset 3px 0 0 var(--green)}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:.62rem;font-weight:800;vertical-align:middle}
.tag.edit{background:var(--amber-soft);color:var(--orange)}
.tag.add{background:var(--green-soft);color:var(--green)}
.acts{grid-area:acts;display:flex;align-items:flex-start}
.item.inline .acts{align-items:center}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border:none;background:none;color:var(--muted);border-radius:12px;cursor:pointer}
.icon-btn:active{background:var(--surface-2)}
.icon-btn.flag.on{color:var(--amber)}
.icon-btn.flag.on svg{fill:currentColor}
.edit-btn{display:none}
body.editing .edit-btn{display:inline-grid;color:var(--orange)}
.ans{grid-area:ans;appearance:none;-webkit-appearance:none;border:none;background:none;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer;width:100%;display:block}
.ans-mask{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.78rem;font-weight:600;background:var(--surface-2)}
.ans-text{display:block;padding:9px 12px;border-radius:10px;background:var(--blue-soft);color:var(--blue);border-left:3px solid var(--blue);font-size:.88rem;line-height:1.7;overflow-wrap:anywhere;animation:pop .18s ease-out}
.item:not(.revealed) .ans-text{display:none}
.item.revealed .ans-mask{display:none}
.item:not(.inline) .ans{width:calc(100% - 8px)}
.item.inline .ans{width:auto;max-width:44vw;text-align:right}
.item.inline .ans-mask{padding:6px 10px}
.item.inline .ans-text{border-left:none;padding:6px 10px;font-weight:700;text-align:right}
mark{background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px var(--amber)}
.item.flash{animation:flash 1.6s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@keyframes flash{0%,40%{background:var(--amber-soft)}100%{background:transparent}}
.empty{max-width:520px;margin:48px auto;padding:0 24px;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.9;white-space:pre-line}

/* ---- 下部の操作バー ---- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.dock-in{display:flex;gap:2px;max-width:560px;margin:0 auto}
.dock-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:6px 2px;border:none;background:none;color:var(--muted);font-size:.64rem;font-weight:700;border-radius:14px;cursor:pointer}
.dock-btn:active{background:var(--surface-2)}
.dock-btn.on{color:var(--accent);background:var(--accent-soft)}
.dock-btn.primary{color:var(--accent-ink);background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.82rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- ダイアログ ---- */
dialog{border:none;border-radius:20px;padding:0;width:calc(100% - 24px);max-width:520px;max-height:calc(100vh - 24px);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:max(12px,5vh) auto auto;overflow:auto}
dialog::backdrop{background:rgba(6,10,16,.6);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.dlg{padding:18px 18px 16px}
.dlg h3{font-size:1rem;font-weight:800;margin-bottom:14px}
.dlg h4{font-size:.8rem;font-weight:800;margin:18px 0 8px;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text)}
.field textarea{min-height:96px;line-height:1.6;resize:vertical}
.field input[type=file]{font-size:.8rem;padding:8px 10px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid transparent;font-size:.9rem;font-weight:800;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.grow2{flex:2}
.note{font-size:.76rem;color:var(--muted);line-height:1.75}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.stat span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.76rem;font-weight:700}
.orig{margin-bottom:12px;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:.78rem;color:var(--muted);line-height:1.7}
.orig summary{cursor:pointer;font-weight:700}
.orig div{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="hero">
  <div>
    <h1><span>土地家屋調査士</span> <span>マインドマップ</span></h1>
    <p id="hero-sub">藤澤悠太さん専用</p>
  </div>
  <div class="countdown" id="countdown" hidden>
    <span class="cd-label" id="cd-label">試験まで あと</span>
    <span class="cd-main"><span id="cd-num">-</span><small id="cd-unit">日</small></span>
  </div>
</header>

<div class="searchbar">
  <div class="searchbar-in">
    <div class="search-field">
      <span data-icon="search" data-size="18"></span>
      <input id="q" type="search" placeholder="キーワードで検索（質問・解答）" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="検索">
      <button class="icon-btn" id="q-clear" type="button" aria-label="検索をクリア" hidden><span data-icon="x" data-size="18"></span></button>
    </div>
    <div class="chips" role="group" aria-label="表示の絞り込み">
      <button class="chip" id="chip-all" type="button" aria-pressed="true">すべて <span class="n" id="n-all"></span></button>
      <button class="chip" id="chip-flag" type="button" aria-pressed="false">⭐ 要復習 <span class="n" id="n-flag"></span></button>
      <span class="hit" id="hit" aria-live="polite"></span>
    </div>
    <div class="edit-banner" id="edit-banner" hidden>✏️ 編集モード：各項目の ✏️ をタップすると質問・解答を直せます。終わったら下の「編集」を押して戻します。</div>
  </div>
</div>

<main class="content" id="content"></main>
<div class="empty" id="empty" hidden></div>

<nav class="dock" aria-label="操作">
  <div class="dock-in">
    <button class="dock-btn" id="btn-fold" type="button"><span class="ic" data-icon="down"></span><span class="lb">全て展開</span></button>
    <button class="dock-btn" id="btn-ans" type="button"><span class="ic" data-icon="eye"></span><span class="lb">解答を表示</span></button>
    <button class="dock-btn" id="btn-edit" type="button"><span class="ic" data-icon="pencil"></span><span class="lb">編集</span></button>
    <button class="dock-btn" id="btn-add" type="button"><span class="ic" data-icon="plus"></span><span class="lb">追加</span></button>
    <button class="dock-btn" id="btn-backup" type="button"><span class="ic" data-icon="save"></span><span class="lb">バックアップ</span></button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 編集ダイアログ -->
<dialog id="dlg-edit" aria-labelledby="ed-title">
  <div class="dlg">
    <h3 id="ed-title">項目を編集</h3>
    <div class="field" id="ed-g-wrap"><label for="ed-g">グループ（任意）</label><input id="ed-g" type="text" autocomplete="off"></div>
    <div class="field"><label for="ed-t">質問</label><textarea id="ed-t"></textarea></div>
    <div class="field"><label for="ed-v">解答</label><textarea id="ed-v"></textarea></div>
    <details class="orig" id="ed-orig" hidden>
      <summary>元の内容を見る</summary>
      <div id="ed-orig-t"></div>
      <div id="ed-orig-v"></div>
    </details>
    <div class="btn-row">
      <button class="btn primary grow2" id="ed-save" type="button">保存</button>
      <button class="btn ghost" id="ed-cancel" type="button">キャンセル</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn danger" id="ed-reset" type="button" hidden>元の内容に戻す</button>
      <button class="btn danger" id="ed-del" type="button" hidden>この項目を削除</button>
    </div>
  </div>
</dialog>

<!-- 追加ダイアログ -->
<dialog id="dlg-add" aria-labelledby="ad-title">
  <div class="dlg">
    <h3 id="ad-title">項目を追加</h3>
    <div class="field"><label for="ad-sec">セクション</label><select id="ad-sec"></select></div>
    <div class="field"><label for="ad-g">グループ（任意）</label><input id="ad-g" type="text" list="ad-g-list" autocomplete="off" placeholder="例：建物"><datalist id="ad-g-list"></datalist></div>
    <div class="field"><label for="ad-t">質問</label><textarea id="ad-t"></textarea></div>
    <div class="field"><label for="ad-v">解答</label><textarea id="ad-v"></textarea></div>
    <div class="btn-row">
      <button class="btn primary grow2" id="ad-save" type="button">追加する</button>
      <button class="btn ghost" id="ad-cancel" type="button">キャンセル</button>
    </div>
  </div>
</dialog>

<!-- バックアップダイアログ -->
<dialog id="dlg-backup" aria-labelledby="bk-title">
  <div class="dlg">
    <h3 id="bk-title">バックアップ・復元</h3>
    <p class="note">編集・追加した項目と⭐は、この端末のブラウザ内にだけ保存されています。ブラウザのデータ削除や機種変更で消えるので、ときどきバックアップを取ってください。</p>
    <div class="stat" id="bk-stat"></div>
    <p class="note" id="bk-last"></p>
    <h4>バックアップを作る</h4>
    <div class="btn-row" style="margin-top:0">
      <button class="btn primary" id="bk-copy" type="button">コピー</button>
      <button class="btn ghost" id="bk-file" type="button">ファイルに保存</button>
    </div>
    <div class="field" id="bk-out-wrap" style="margin-top:10px" hidden>
      <label for="bk-out">自動でコピーできなかったので、下の文字を全選択してコピーしてください</label>
      <textarea id="bk-out" readonly></textarea>
    </div>
    <h4>バックアップから復元する</h4>
    <div class="field"><label for="bk-file-in">バックアップファイルを選ぶ</label><input id="bk-file-in" type="file" accept=".json,application/json,text/plain"></div>
    <div class="field"><label for="bk-in">またはバックアップの文字を貼り付け</label><textarea id="bk-in" placeholder='{"app":"mindmap_tree", ...}'></textarea></div>
    <p class="note">復元は「追加」です。今ある編集や追加項目は消えず、同じ項目だけバックアップの内容で上書きされます。</p>
    <div class="btn-row">
      <button class="btn primary grow2" id="bk-restore" type="button">取り込む</button>
      <button class="btn ghost" id="bk-close" type="button">閉じる</button>
    </div>
  </div>
</dialog>

<script>
const DATA = [
  {id:'A',title:'A 3月の制限',items:[
    {t:'職印証明書',v:'有り'},
    {t:'戸籍謄本',v:'有り'},
    {t:'法人の登記事項証明書',v:'有り（※工事施工会社の登記簿謄本は3月の制限無し）'},
    {t:'申請書や委任状に押印した実印の印鑑証明書',v:'有り'},
    {t:'公務員が作成した代理権限証書（法定代理）',v:'有り'},
    {t:'法定相続情報一覧図',v:'無し'},
    {t:'住所証明書',v:'無し'},
    {t:'本人確認情報（職印証明書は期限あり）',v:'無し'},
    {t:'工事業者の印鑑証明書',v:'無し'},
    {t:'抵当権者の印鑑証明書',v:'無し'},
    {t:'委任状',v:'無し'},
    {t:'公務員が作成した代理権限証書（任意代理）',v:'無し'},
  ]},
  {id:'B',title:'B 各情報の保存期間',items:[
    {t:'土地の閉鎖登記記録の保存期間は？',v:'50年間'},
    {t:'抹消された共同担保目録の保存期間は？',v:'10年間'},
    {t:'受付帳に記録された情報の保存期間は？',v:'10年間'},
    {t:'登記識別情報の失効の申出の情報の保存期間は？',v:'10年間'},
    {t:'閉鎖した地図・地図に準ずる図面の保存期間は？',v:'永久'},
    {t:'閉鎖した建物所在図の保存期間は？',v:'永久'},
    {t:'建物の閉鎖登記記録の保存期間は？',v:'30年間'},
    {t:'登記の申請情報と添付情報の保存期間は？',v:'30年間'},
    {t:'変更または更正前の図面の保存期間は？',v:'30年間'},
    {t:'電磁的記録に保存された書面の図面の保存期間は？',v:'30年間'},
    {t:'電磁的記録に保存された書面の地役権図面の保存期間は？',v:'30年間'},
    {t:'職権表示登記つづり込み帳の書類情報の保存期間は？',v:'30年間'},
    {t:'筆界特定書以外の手続き記録の情報の保存期間は？',v:'30年間'},
    {t:'職権表示等事件簿に記録された情報の保存期間は？',v:'5年間'},
    {t:'決定・審査請求事件簿の情報の保存期間は？',v:'5年間'},
    {t:'法定相続情報一覧図の保存期間は？',v:'5年間'},
    {t:'請求書類つづり込み帳の情報の保存期間は？',v:'1年間'},

const store = {
  get(k, d) { try { const s = localStorage.getItem(k); return s === null ? d : JSON.parse(s); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
function persist(k, v) { if (!store.set(k, v)) toast('⚠ 保存できませんでした（プライベートモード等）'); }

function cleanEdits(o) {
  const r = {};
  if (isObj(o)) Object.keys(o).forEach(k => { const e = o[k]; if (!badKey(k) && isObj(e) && isStr(e.t) && isStr(e.v)) r[k] = { t: e.t, v: e.v }; });
  return r;
}
function cleanFlags(o) {
  const r = {};
  if (isObj(o)) Object.keys(o).forEach(k => { if (!badKey(k) && o[k]) r[k] = 1; });
  return r;
}
function cleanCustom(a) {
  const r = [];
  if (Array.isArray(a)) a.forEach(c => {
    if (isObj(c) && isStr(c.customId) && isStr(c.sectionId) && isStr(c.t) && isStr(c.v))
      r.push({ customId: c.customId, sectionId: c.sectionId, g: isStr(c.g) ? c.g : '', t: c.t, v: c.v });

  return r;
}

const ITEMS = [];
const ITEMS_BY_CAT = new Map();
const BY_KEY = new Map();
const CAT_BY_ID = new Map(DATA.map(c => [c.id, c]));
(function indexData() {
  const seen = {};
  let legacyIdx = 0;
  DATA.forEach(cat => {
    const list = [];
    cat.items.forEach(item => {
      const leaves = item.g ? item.sub.map(s => ({ g: item.g, o: s })) : [{ g: '', o: item }];
      leaves.forEach(L => {
        const base = cat.id + '|' + L.g + '|' + L.o.t;
        seen[base] = (seen[base] || 0) + 1;
        const key = seen[base] === 1 ? base : base + '#' + seen[base];
        const it = { key: key, legacy: cat.id + '_' + (legacyIdx++), catId: cat.id, g: L.g, t: L.o.t, v: L.o.v };
        ITEMS.push(it); list.push(it); BY_KEY.set(key, it);
      });
    });
    ITEMS_BY_CAT.set(cat.id, list);
  });
})();

// 旧版は「A_12」のような通し番号キーで編集を保存していた。初回だけ新しいIDへ引き継ぐ。
function migrateLegacyEdits() {
  const legacyKeys = Object.keys(edits).filter(k => /^[^|]+_\d+$/.test(k));
  if (!legacyKeys.length) return;
  if (store.get(LEGACY_BACKUP_KEY, null) === null) store.set(LEGACY_BACKUP_KEY, edits);
  const byLegacy = new Map(ITEMS.map(it => [it.legacy, it]));
  let moved = 0;
  legacyKeys.forEach(k => {
    const it = byLegacy.get(k);
    if (!it) return; // 対応する項目が無い古い編集は触らず残す
    if (!edits[it.key]) edits[it.key] = edits[k];
    delete edits[k];
    moved++;
  });
  if (moved) persist(EDITS_KEY, edits);
}

function rowsOf(cat) {
  const rows = (ITEMS_BY_CAT.get(cat.id) || []).map(it => {
    const e = edits[it.key];
    return { key: it.key, g: it.g, t: e ? e.t : it.t, v: e ? e.v : it.v, edited: !!e, custom: false, orig: it, catId: cat.id };
  });
  customItems.forEach(c => {
    if (c.sectionId === cat.id) rows.push({ key: c.customId, g: c.g || '', t: c.t, v: c.v, edited: false, custom: true, orig: null, catId: cat.id });
  });
  return rows;
}
function rowByKey(key) {
  const it = BY_KEY.get(key);
  if (it) { const e = edits[key]; return { key: key, g: it.g, t: e ? e.t : it.t, v: e ? e.v : it.v, edited: !!e, custom: false, orig: it, catId: it.catId }; }
  const c = customItems.find(x => x.customId === key);
  return c ? { key: key, g: c.g || '', t: c.t, v: c.v, edited: false, custom: true, orig: null, catId: c.sectionId } : null;
}
function allKeys() {
  return ITEMS.map(i => i.key).concat(customItems.filter(c => CAT_BY_ID.has(c.sectionId)).map(c => c.customId));
}

function appendText(parent, text, terms) {
  const n = norm(text);
  if (!terms.length || n.length !== text.length) { parent.appendChild(document.createTextNode(text)); return; }
  const mark = new Array(text.length).fill(false);
  terms.forEach(t => {
    let i = n.indexOf(t);
    while (i !== -1) { for (let k = i; k < i + t.length; k++) mark[k] = true; i = n.indexOf(t, i + t.length); }
  });
  let i = 0;
  while (i < text.length) {
    let j = i;
    while (j < text.length && mark[j] === mark[i]) j++;
    const s = text.slice(i, j);
    if (mark[i]) { const m = document.createElement('mark'); m.textContent = s; parent.appendChild(m); }
    else parent.appendChild(document.createTextNode(s));
    i = j;
  }
}
function appendLines(parent, text) {
  String(text).split('\n').forEach((line, i) => {
    if (i) parent.appendChild(document.createElement('br'));
    parent.appendChild(document.createTextNode(line));
  });
}

function makeRow(r, terms) {
  const inline = r.v.indexOf('\n') < 0 && r.v.length <= 12 && r.t.length <= 44;
  const row = el('div', 'item' + (inline ? ' inline' : '') + (r.custom ? ' is-custom' : '') + (r.edited ? ' is-edited' : '') + (revealed.has(r.key) ? ' revealed' : ''));
  row.dataset.key = r.key;

  const q = el('div', 'q');
  appendText(q, r.t, terms);
  if (r.edited) q.appendChild(el('span', 'tag edit', '編集済'));
  if (r.custom) q.appendChild(el('span', 'tag add', '追加'));

  const acts = el('div', 'acts');
  const eb = el('button', 'icon-btn edit-btn');
  eb.type = 'button'; eb.innerHTML = svg('pencil', 18); eb.setAttribute('aria-label', '編集');
  eb.addEventListener('click', e => { e.stopPropagation(); openEditDialog(r.key); });
  const fb = el('button', 'icon-btn flag' + (flags[r.key] ? ' on' : ''));
  fb.type = 'button'; fb.innerHTML = svg('star', 20);
  fb.setAttribute('aria-label', '要復習'); fb.setAttribute('aria-pressed', flags[r.key] ? 'true' : 'false');
  fb.addEventListener('click', e => { e.stopPropagation(); toggleFlag(r.key, fb); });
  acts.append(eb, fb);

  const a = el('button', 'ans');
  a.type = 'button';
  a.setAttribute('aria-expanded', revealed.has(r.key) ? 'true' : 'false');
  const txt = el('span', 'ans-text');
  appendLines(txt, r.v);
  a.append(el('span', 'ans-mask', '👆 タップして解答'), txt);

  row.append(q, acts, a);
  row.addEventListener('click', () => toggleReveal(r.key, row));
  return row;
}

function toggleReveal(key, row) {
  const on = !revealed.has(key);
  if (on) revealed.add(key); else revealed.delete(key);
  row.classList.toggle('revealed', on);
  row.querySelector('.ans').setAttribute('aria-expanded', on ? 'true' : 'false');
}

function makeSection(cat, rows, terms, force, total) {
  const det = el('details', 'cat');
  det.dataset.cat = cat.id;
  det.dataset.shown = rows.length;
  det.open = force || ui.open.indexOf(cat.id) >= 0;

  const sum = el('summary');
  sum.innerHTML = '<span class="badge"></span><span class="cat-text"><span class="cat-title"></span><span class="cat-meta" style="display:block"></span></span><span class="chev">' + svg('chevR', 20) + '</span>';
  sum.querySelector('.badge').textContent = cat.id;
  sum.querySelector('.cat-title').textContent = cat.title.replace(/^\S+\s+/, '');
  det.appendChild(sum);

  const body = el('div', 'cat-body');
  let lastG = null;
  rows.forEach(r => {
    if (r.g && r.g !== lastG) body.appendChild(el('div', 'group' + (r.custom ? ' custom' : ''), (r.custom ? '★ ' : '') + r.g));
    lastG = r.g;
    body.appendChild(makeRow(r, terms));
  });
  det.appendChild(body);
  // toggle は非同期で届くので、作り直し済み（画面から外れた）要素のイベントは無視する
  det.addEventListener('toggle', () => { if (det.isConnected) onSectionToggle(cat.id, det.open, force); });
  updateMetaOf(det);
  return det;
}

function onSectionToggle(id, open, force) {
  if (!force) {
    const i = ui.open.indexOf(id);
    if (open && i < 0) { ui.open.push(id); saveUi(); }
    else if (!open && i >= 0) { ui.open.splice(i, 1); saveUi(); }
  }
  updateFoldBtn();
}

function updateMetaOf(det) {
  const cat = CAT_BY_ID.get(det.dataset.cat);
  const rows = rowsOf(cat);
  const total = rows.length;
  const flagged = rows.filter(r => flags[r.key]).length;
  const shown = +det.dataset.shown;
  const meta = det.querySelector('.cat-meta');
  meta.textContent = shown !== total ? shown + ' / ' + total + '問' : total + '問';
  if (flagged) meta.appendChild(el('span', 'fl', ' ・ ⭐' + flagged));
}
function updateMeta() { document.querySelectorAll('#content details.cat').forEach(updateMetaOf); }

function updateCounts() {
  const keys = allKeys();
  const flagged = keys.filter(k => flags[k]).length;
  $('#n-all').textContent = keys.length;
  $('#n-flag').textContent = flagged;
  $('#hero-sub').textContent = '藤澤悠太さん専用 ・ 全' + keys.length + '問' + (flagged ? ' ・ ⭐' + flagged : '');
}

function setDock(id, icon, label) {
  const b = $('#' + id);
  b.querySelector('.ic').innerHTML = svg(icon);
  b.querySelector('.lb').textContent = label;
}
function updateFoldBtn() {
  const ds = [].slice.call(document.querySelectorAll('#content details.cat'));
  const allOpen = ds.length > 0 && ds.every(d => d.open);
  setDock('btn-fold', allOpen ? 'up' : 'down', allOpen ? '全て閉じる' : '全て展開');
}

function renderAll() {
  const qText = $('#q').value;
  const terms = parseTerms(qText);
  const force = terms.length > 0 || ui.flagOnly;   // 検索・絞り込み中はセクションを強制的に開く
  const frag = document.createDocumentFragment();
  let shown = 0;
  DATA.forEach(cat => {
    const all = rowsOf(cat);
    let rows = all;
    if (ui.flagOnly) rows = rows.filter(r => flags[r.key]);
    if (terms.length) {
      const ct = norm(cat.title);
      rows = rows.filter(r => {
        const hay = norm(r.g + ' ' + r.t + ' ' + r.v) + ' ' + ct;
        return terms.every(t => hay.indexOf(t) >= 0);
      });
    }
    if (!rows.length) return;
    shown += rows.length;
    frag.appendChild(makeSection(cat, rows, terms, force, all.length));
  });
  $('#content').replaceChildren(frag);

  const empty = $('#empty');
  if (shown === 0) {
    empty.hidden = false;
    empty.textContent = terms.length
      ? '「' + qText.trim() + '」に一致する項目がありません。'
      : (ui.flagOnly ? 'まだ「要復習」の項目がありません。\n各項目の右上の ☆ をタップすると、ここに集まります。' : '表示できる項目がありません。');
  } else {
    empty.hidden = true;
  }
  $('#hit').textContent = (terms.length || ui.flagOnly) ? shown + '件' : '';
  updateCounts();
  updateFoldBtn();
}

// ---------- ボタンの動作 ----------
function toggleFold() {
  const ds = [].slice.call(document.querySelectorAll('#content details.cat'));
  const allOpen = ds.length > 0 && ds.every(d => d.open);
  ds.forEach(d => { d.open = !allOpen; });
}

function toggleShowAll() {
  showAll = !showAll;
  revealed.clear();
  if (showAll) allKeys().forEach(k => revealed.add(k));
  document.querySelectorAll('.item').forEach(row => {
    const on = revealed.has(row.dataset.key);
    row.classList.toggle('revealed', on);
    row.querySelector('.ans').setAttribute('aria-expanded', on ? 'true' : 'false');
  });
  setDock('btn-ans', showAll ? 'eyeOff' : 'eye', showAll ? '解答を隠す' : '解答を表示');
  $('#btn-ans').classList.toggle('on', showAll);
}

function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('editing', editMode);
  $('#edit-banner').hidden = !editMode;
  $('#btn-edit').classList.toggle('on', editMode);
  setDock('btn-edit', editMode ? 'check' : 'pencil', editMode ? '編集を終える' : '編集');
}

function toggleFlag(key, btn) {
  if (flags[key]) delete flags[key]; else flags[key] = 1;
  persist(FLAG_KEY, flags);
  if (ui.flagOnly) { renderAll(); return; }
  const on = !!flags[key];
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  updateCounts();
  updateMeta();
}

function syncChips() {
  $('#chip-all').setAttribute('aria-pressed', ui.flagOnly ? 'false' : 'true');
  $('#chip-flag').setAttribute('aria-pressed', ui.flagOnly ? 'true' : 'false');
}
function setFlagOnly(on) {
  ui.flagOnly = on;
  saveUi();
  syncChips();
  renderAll();
  window.scrollTo(0, 0);
}

function focusRow(key) {
  const row = [].slice.call(document.querySelectorAll('.item')).find(r => r.dataset.key === key);
  if (!row) return;
  const det = row.closest('details');
  if (det && !det.open) det.open = true;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  row.classList.add('flash');
}

// ---------- ダイアログ ----------
function showDlg(d) { try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } }
function closeDlg(d) { try { d.close(); } catch (e) { d.removeAttribute('open'); } }

// 編集
let editing = null;
function openEditDialog(key) {
  const r = rowByKey(key);
  if (!r) return;
  editing = { key: key, custom: r.custom };
  $('#ed-title').textContent = r.custom ? '追加した項目を編集' : '項目を編集';
  $('#ed-g-wrap').hidden = !r.custom;
  $('#ed-g').value = r.g || '';
  $('#ed-t').value = r.t;
  $('#ed-v').value = r.v;
  $('#ed-reset').hidden = !r.edited;
  $('#ed-del').hidden = !r.custom;
  const orig = $('#ed-orig');
  orig.hidden = !r.edited;
  orig.open = false;
  if (r.edited) { $('#ed-orig-t').textContent = '質問：' + r.orig.t; $('#ed-orig-v').textContent = '解答：' + r.orig.v; }
  showDlg($('#dlg-edit'));
}
function saveEdit() {
  if (!editing) return;
  const t = $('#ed-t').value.trim();
  const v = $('#ed-v').value.trim();
  if (!t || !v) { toast('質問と解答を入力してください'); return; }
  if (editing.custom) {
    const c = customItems.find(x => x.customId === editing.key);
    if (c) { c.t = t; c.v = v; c.g = $('#ed-g').value.trim(); persist(ADD_KEY, customItems); }
  } else {
    const it = BY_KEY.get(editing.key);
    if (it && t === it.t && v === it.v) delete edits[editing.key];
    else edits[editing.key] = { t: t, v: v };
    persist(EDITS_KEY, edits);
  }
  closeDlg($('#dlg-edit'));
  editing = null;
  renderAll();
  toast('保存しました');
}
function resetEdit() {
  if (!editing || editing.custom) return;
  if (!confirm('この項目を元の内容に戻しますか？')) return;
  delete edits[editing.key];
  persist(EDITS_KEY, edits);
  closeDlg($('#dlg-edit'));
  editing = null;
  renderAll();
  toast('元に戻しました');
}
function deleteCustom() {
  if (!editing || !editing.custom) return;
  if (!confirm('この追加項目を削除しますか？（元に戻せません）')) return;
  const k = editing.key;
  customItems = customItems.filter(c => c.customId !== k);
  delete flags[k];
  revealed.delete(k);
  persist(ADD_KEY, customItems);
  persist(FLAG_KEY, flags);
  closeDlg($('#dlg-edit'));
  editing = null;
  renderAll();
  toast('削除しました');
}

// 追加
function refreshGroupList() {
  const cat = CAT_BY_ID.get($('#ad-sec').value);
  const names = new Set();
  if (cat) rowsOf(cat).forEach(r => { if (r.g) names.add(r.g); });
  const dl = $('#ad-g-list');
  dl.replaceChildren();
  names.forEach(n => { const o = document.createElement('option'); o.value = n; dl.appendChild(o); });
}
function openAddDialog() {
  const sel = $('#ad-sec');
  sel.replaceChildren();
  DATA.forEach(c => { const o = el('option', '', c.title); o.value = c.id; sel.appendChild(o); });
  if (ui.lastSection && CAT_BY_ID.has(ui.lastSection)) sel.value = ui.lastSection;
  refreshGroupList();
  ['ad-g', 'ad-t', 'ad-v'].forEach(id => { $('#' + id).value = ''; });
  showDlg($('#dlg-add'));
}
function saveAdd() {
  const sectionId = $('#ad-sec').value;
  const g = $('#ad-g').value.trim();
  const t = $('#ad-t').value.trim();
  const v = $('#ad-v').value.trim();
  if (!t || !v) { toast('質問と解答を入力してください'); return; }
  const customId = 'custom_' + Date.now();
  customItems.push({ customId: customId, sectionId: sectionId, g: g, t: t, v: v });
  persist(ADD_KEY, customItems);
  ui.lastSection = sectionId;
  if (ui.open.indexOf(sectionId) < 0) ui.open.push(sectionId);
  ui.flagOnly = false;
  saveUi();
  if (showAll) revealed.add(customId);
  $('#q').value = '';
  $('#q-clear').hidden = true;
  syncChips();
  closeDlg($('#dlg-add'));
  renderAll();
  focusRow(customId);
  toast('追加しました');
}

// バックアップ
function fmtDate(ms) {
  const d = new Date(ms);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function makeBackup() {
  return JSON.stringify({ app: 'mindmap_tree', version: 2, exportedAt: new Date().toISOString(), edits: edits, customItems: customItems, flags: flags }, null, 1);
}
function markBackedUp() {
  ui.lastBackup = Date.now();
  saveUi();
  $('#bk-last').textContent = '最終バックアップ：' + fmtDate(ui.lastBackup);
}
function openBackupDialog() {
  const keys = allKeys();
  const stat = $('#bk-stat');
  stat.replaceChildren();
  ['編集 ' + Object.keys(edits).length + '件', '追加 ' + customItems.length + '件', '⭐ ' + keys.filter(k => flags[k]).length + '件']
    .forEach(s => stat.appendChild(el('span', '', s)));
  $('#bk-last').textContent = ui.lastBackup ? '最終バックアップ：' + fmtDate(ui.lastBackup) : '最終バックアップ：まだありません';
  $('#bk-out-wrap').hidden = true;
  $('#bk-in').value = '';
  $('#bk-file-in').value = '';
  showDlg($('#dlg-backup'));
}
async function copyBackup() {
  const text = makeBackup();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* 下の方法を試す */ }
  if (!ok) {
    const ta = $('#bk-out');
    ta.value = text;
    $('#bk-out-wrap').hidden = false;
    ta.focus();
    ta.select();
    try { ok = document.execCommand('copy'); } catch (e) { /* 手動コピー */ }
  }
  if (ok) { markBackedUp(); toast('コピーしました'); }
  else toast('下の文字を長押ししてコピーしてください');
}
function saveBackupFile() {
  const blob = new Blob([makeBackup()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mindmap-backup-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  markBackedUp();
  toast('ファイルに保存しました');
}
function restoreBackup() {
  const text = $('#bk-in').value.trim();
  if (!text) { toast('バックアップの文字を貼り付けるか、ファイルを選んでください'); return; }
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('読み込めませんでした（形式が正しくありません）'); return; }
  if (!isObj(data) || data.app !== 'mindmap_tree') { toast('このアプリのバックアップではありません'); return; }
  const e2 = cleanEdits(data.edits), c2 = cleanCustom(data.customItems), f2 = cleanFlags(data.flags);
  const nE = Object.keys(e2).length, nC = c2.length, nF = Object.keys(f2).length;
  if (!nE && !nC && !nF) { toast('取り込める内容がありませんでした'); return; }
  if (!confirm('編集' + nE + '件・追加' + nC + '件・⭐' + nF + '件を取り込みます。\n今ある内容は消えず、同じ項目だけ上書きされます。よろしいですか？')) return;
  Object.assign(edits, e2);
  c2.forEach(c => {
    const i = customItems.findIndex(x => x.customId === c.customId);
    if (i >= 0) customItems[i] = c; else customItems.push(c);
  });
  Object.assign(flags, f2);
  persist(EDITS_KEY, edits);
  persist(ADD_KEY, customItems);
  persist(FLAG_KEY, flags);
  closeDlg($('#dlg-backup'));
  renderAll();
  toast('取り込みました');
}

// ---------- カウントダウン ----------
function initCountdown() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = Math.round((EXAM_DATE - today) / 86400000);
  if (days < 0) return;
  $('#countdown').hidden = false;
  if (days === 0) {
    $('#cd-label').textContent = '本日は';
    $('#cd-num').textContent = '試験日';
    $('#cd-unit').textContent = '';
  } else {
    $('#cd-num').textContent = days;
  }
}

// ---------- 起動 ----------
migrateLegacyEdits();
document.querySelectorAll('[data-icon]').forEach(n => { n.innerHTML = svg(n.dataset.icon, +n.dataset.size || 22); });
initCountdown();
syncChips();

let qTimer;
$('#q').addEventListener('input', () => {
  $('#q-clear').hidden = !$('#q').value;
  clearTimeout(qTimer);
  qTimer = setTimeout(renderAll, 120);
});
$('#q-clear').addEventListener('click', () => { $('#q').value = ''; $('#q-clear').hidden = true; renderAll(); $('#q').focus(); });
$('#chip-all').addEventListener('click', () => setFlagOnly(false));
$('#chip-flag').addEventListener('click', () => setFlagOnly(true));
$('#btn-fold').addEventListener('click', toggleFold);
$('#btn-ans').addEventListener('click', toggleShowAll);
$('#btn-edit').addEventListener('click', toggleEditMode);
$('#btn-add').addEventListener('click', openAddDialog);
$('#btn-backup').addEventListener('click', openBackupDialog);
$('#ed-save').addEventListener('click', saveEdit);
$('#ed-cancel').addEventListener('click', () => { closeDlg($('#dlg-edit')); editing = null; });
$('#ed-reset').addEventListener('click', resetEdit);
$('#ed-del').addEventListener('click', deleteCustom);
$('#ad-sec').addEventListener('change', refreshGroupList);
$('#ad-save').addEventListener('click', saveAdd);
$('#ad-cancel').addEventListener('click', () => closeDlg($('#dlg-add')));
$('#bk-copy').addEventListener('click', copyBackup);
$('#bk-file').addEventListener('click', saveBackupFile);
$('#bk-restore').addEventListener('click', restoreBackup);
$('#bk-close').addEventListener('click', () => closeDlg($('#dlg-backup')));
$('#bk-file-in').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => { $('#bk-in').value = String(fr.result || ''); toast('読み込みました。「取り込む」を押してください'); };
  fr.onerror = () => toast('ファイルを読み込めませんでした');
  fr.readAsText(f);
});

renderAll();
</script>
</body>
